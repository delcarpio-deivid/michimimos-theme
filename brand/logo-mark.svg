    <path d="M308 262 C316 254 330 254 338 262"/>
    <!-- W mouth -->
    <path d="M288 302 C292 310 298 310 300 304 C302 310 308 310 312 302"/>
  </g>
  <!-- Heart nose -->
  <path fill="#4A2E1F" d="M300 284 C296.5 279 290.5 279.5 290.5 285 C290.5 290 300 298 300 298 C300 298 309.5 290 309.5 285 C309.5 279.5 303.5 279 300 284 Z"/>
  <!-- Whiskers -->
  <g stroke="#4A2E1F" stroke-width="2" stroke-linecap="round">
    <line x1="232" y1="280" x2="262" y2="284"/>
    <line x1="230" y1="292" x2="260" y2="292"/>
    <line x1="232" y1="304" x2="262" y2="300"/>
    <line x1="368" y1="280" x2="338" y2="284"/>
    <line x1="370" y1="292" x2="340" y2="292"/>
    <line x1="368" y1="304" x2="338" y2="300"/>
