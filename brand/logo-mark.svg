<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 555 426" fill="none" role="img" aria-hidden="true">
  <title>Michimimos</title>
  <!-- Plant: 5 leaves -->
  <g fill="#A09050" stroke="#A09050" stroke-linecap="round">
    <path d="M82 318 C80 270 76 220 84 155" stroke-width="5" fill="none"/>
    <ellipse cx="82" cy="138" rx="13" ry="22" transform="rotate(4 82 138)"/>
    <ellipse cx="58" cy="172" rx="16" ry="26" transform="rotate(-32 58 172)"/>
    <ellipse cx="108" cy="168" rx="15" ry="25" transform="rotate(28 108 168)"/>
    <ellipse cx="56" cy="228" rx="15" ry="24" transform="rotate(-22 56 228)"/>
    <ellipse cx="108" cy="222" rx="14" ry="23" transform="rotate(20 108 222)"/>
  </g>
  <!-- Bed outer dome (rounded) -->
  <path fill="#D07050" d="
    M128 372
    C120 300 118 210 124 155
    C132 70 200 22 300 22
    C400 22 468 70 476 155
    C482 210 480 300 472 372
    C468 398 420 408 300 408
    C180 408 132 398 128 372
