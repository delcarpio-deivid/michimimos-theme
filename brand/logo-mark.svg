      M214 318
      C200 295 198 268 212 245
      C208 228 218 212 238 208
      C248 188 272 178 300 178
      C328 178 352 188 362 208
      C382 212 392 228 388 245
      C402 268 400 295 386 318
      C408 328 418 352 398 368
      C375 382 335 390 300 390
      C265 390 225 382 202 368
      C182 352 192 328 214 318
      Z"/>
    <!-- Tall ears -->
    <path d="M240 214 C232 168 248 142 272 168 C262 188 250 204 240 214 Z"/>
    <path d="M360 214 C368 168 352 142 328 168 C338 188 350 204 360 214 Z"/>
