    <ellipse cx="262" cy="386" rx="24" ry="15"/>
    <ellipse cx="338" cy="386" rx="24" ry="15"/>
    <!-- Curved tail -->
    <path d="M390 330 C418 318 428 342 418 358 C408 372 396 365 390 350 C386 340 386 335 390 330 Z"/>
  </g>
  <!-- Inner ears -->
  <path fill="#D4A080" d="M250 200 C246 175 256 160 268 175 C262 188 254 196 250 200 Z"/>
  <path fill="#D4A080" d="M350 200 C354 175 344 160 332 175 C338 188 346 196 350 200 Z"/>
