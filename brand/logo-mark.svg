    <line x1="262" y1="381" x2="262" y2="393"/>
    <line x1="270" y1="382" x2="270" y2="392"/>
    <line x1="330" y1="382" x2="330" y2="392"/>
    <line x1="338" y1="381" x2="338" y2="393"/>
    <line x1="346" y1="382" x2="346" y2="392"/>
